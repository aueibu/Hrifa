name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  baseline:
    name: Syntax and token build
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check JavaScript syntax
        shell: bash
        run: |
          files=(
            legacy/applets.js
            legacy/a-stone-throw/app.js
            legacy/affine-focus-transform-explorer/app.js
            legacy/color-checker/app.js
            legacy/color-checker/color-names.js
            legacy/custom-reader/app.js
            legacy/custom-reader/build.js
            legacy/custom-reader/serve.js
            legacy/grid-traversal/app.js
            legacy/hrifa-edel/app.js
            legacy/lines-and-marks/hatch_regions.js
            legacy/lines-and-marks/inkline_app.js
            legacy/palette-chroma/app.js
            legacy/polygon-annulus-explorer/app.js
            legacy/polygon-annulus-explorer/core.js
            legacy/polygon-annulus-explorer/worker.js
            legacy/polygon-focus-vantage/app.js
            legacy/polygon-fold-explorer/app.js
            legacy/polygon-irregular-3d/app.js
            legacy/polygon-new-tab/newtab.js
            legacy/username-seeds/script.js
          )
          for file in "${files[@]}"; do
            node --check "$file"
          done

      - name: Compile PDF Ingest application
        run: python -m py_compile legacy/pdf-ingest/app.py

      - name: Build Design Tokens
        run: |
          npm ci --prefix legacy/design-tokens
          npm run build --prefix legacy/design-tokens
