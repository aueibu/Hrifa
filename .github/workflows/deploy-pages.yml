name: Deploy Pages and refresh reader

on:
  # UI and site changes deploy immediately, without contacting reader sources.
  push:
    branches:
      - main
  # A deliberately modest crawl: once per day at 11:17 UTC. GitHub's scheduler
  # can run later than its requested time, so the digest itself records the
  # actual generation time shown to readers.
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: custom-reader/package-lock.json

      # The deployed digest carries each feed's ETag/Last-Modified validators.
      # Restore it before a refresh so unchanged sources can reply 304 and we
      # can reuse their existing items instead of downloading them again.
      - name: Restore the latest reader digest for conditional refreshes
        if: github.event_name != 'push'
        working-directory: custom-reader
        run: |
          if curl --fail --location --retry 3 --max-time 30 \
            "https://aueibu.github.io/Hrifa/custom-reader/feed-data.json?run=${{ github.run_id }}" \
            --output feed-data.json; then
            test -s feed-data.json
          else
            echo "No deployed digest available; refreshing all sources without validators."
          fi

      - name: Build the current reader digest
        if: github.event_name != 'push'
        working-directory: custom-reader
        run: |
          npm ci
          node build.js

      # The digest is intentionally not committed. On a code-only push, carry
      # the live copy forward so that deployment is immediate but does not
      # crawl any publisher feeds. The query value bypasses the short CDN cache.
      - name: Reuse the latest deployed digest
        if: github.event_name == 'push'
        working-directory: custom-reader
        run: |
          curl --fail --location --retry 3 --max-time 30 \
            "https://aueibu.github.io/Hrifa/custom-reader/feed-data.json?run=${{ github.run_id }}" \
            --output feed-data.json
          test -s feed-data.json

      - name: Build Mantine shell
        working-directory: shell
        run: |
          corepack enable
          yarn install --immutable
          yarn build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # The site is still authored from the repository root, but the generated
      # feed data is deployed as an artifact rather than committed to main.
      - name: Assemble Pages artifact
        run: |
          site_dir="$RUNNER_TEMP/hrifa-pages"
          mkdir -p "$site_dir"
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'custom-reader/node_modules' \
            --exclude 'point-construction' \
            --exclude 'shell' \
            ./ "$site_dir/"
          rsync -a shell/dist/ "$site_dir/"
          cp shell/dist/index.html "$site_dir/404.html"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/hrifa-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
