<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Stone's Throw — Drop Simulator</title>
<link rel="stylesheet" href="styles.css">
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
    "@dimforge/rapier3d-compat": "https://unpkg.com/@dimforge/rapier3d-compat@0.14.0/rapier.es.js"
  }
}
</script>
</head>
<body>
<header>
  <h1>A Stone&rsquo;s Throw</h1>
  <p class="subtitle">Drop objects onto a surface and see where they land.</p>
</header>

<main>
  <section class="panel controls">
    <div class="control-group">
      <h2>Surface</h2>
      <label for="surfaceSelect">Type</label>
      <select id="surfaceSelect"></select>

      <label for="textureSelect">Texture</label>
      <select id="textureSelect">
        <option value="smooth">Smooth</option>
        <option value="rough">Rough</option>
      </select>

      <label for="angleSlider">Tilt: <span id="angleValue">0&deg;</span></label>
      <input type="range" id="angleSlider" min="0" max="30" value="0" step="1">

      <label for="heightSlider">Drop height: <span id="heightValue">1.0 m</span></label>
      <input type="range" id="heightSlider" min="0.1" max="4" value="1" step="0.1">
    </div>

    <div class="control-group">
      <h2>Grid</h2>
      <label for="colsInput">Columns</label>
      <input type="number" id="colsInput" min="2" max="50" value="6">
      <label for="rowsInput">Rows</label>
      <input type="number" id="rowsInput" min="2" max="50" value="6">
    </div>

    <div class="control-group">
      <h2>Shape</h2>
      <label for="shapeSelect">Form</label>
      <select id="shapeSelect"></select>

      <label for="sizeSlider">Target size: <span id="sizeValue">0.06 m</span></label>
      <input type="range" id="sizeSlider" min="0.01" max="0.3" value="0.06" step="0.01">

      <label for="meshUpload">Import shape (.obj / .stl)</label>
      <input type="file" id="meshUpload" accept=".obj,.stl">
      <p id="uploadStatus" class="status"></p>
    </div>

    <div class="control-group">
      <h2>Material</h2>
      <label for="materialSelect">Type</label>
      <select id="materialSelect"></select>
      <p id="materialInfo" class="status"></p>

      <div class="advanced-props" id="customMaterialProps">
        <label for="densitySlider">Density (kg/m&sup3;): <span id="densityValue">0</span></label>
        <input type="range" id="densitySlider" min="100" max="20000" value="2000" step="50">

        <label for="hardnessSlider">Restitution (bounciness): <span id="hardnessValue">0</span></label>
        <input type="range" id="hardnessSlider" min="0" max="1" value="0.4" step="0.05">

        <label for="frictionSlider">Friction: <span id="frictionValue">0</span></label>
        <input type="range" id="frictionSlider" min="0" max="1" value="0.4" step="0.05">
      </div>
    </div>

    <div class="control-group">
      <h2>Batch</h2>
      <label for="countInput">Count</label>
      <input type="number" id="countInput" min="1" max="60" value="10">
      <button id="addItemBtn" type="button">Add to batch</button>
      <ul id="batchList" class="batch-list"></ul>
    </div>

    <div class="control-group actions">
      <button id="dropBtn" type="button" class="primary">Drop</button>
      <button id="resetBtn" type="button">Reset</button>
      <button id="copyBtn" type="button">Copy results</button>
      <p id="status" class="status">Add items to the batch, then drop.</p>
    </div>
  </section>

  <section class="panel stage">
    <div id="sceneContainer"></div>
  </section>

  <section class="panel results">
    <h2>Results</h2>
    <div id="resultsSummary" class="results-summary">No drops yet.</div>
    <div id="resultsGrid" class="results-grid"></div>
  </section>
</main>

<script type="module" src="app.js?v=28"></script>
</body>
</html>
