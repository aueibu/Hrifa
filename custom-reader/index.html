<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="description" content="A curated digest of recent articles from a chosen set of sources." />
<title>Custom Reader — Hrifa</title>
<link rel="stylesheet" href="../design-tokens/build/css/hrifa.css" />
<link rel="stylesheet" href="../design-tokens/build/css/fonts.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="page" id="page">
  <main class="shell">
    <header class="hero">
      <p class="eyebrow">HRIFA / CUSTOM READER</p>
      <h1>Today's Digest</h1>
      <p id="generatedAt" class="generated"></p>
    </header>

    <section id="errorBanner" class="error-banner" hidden></section>

    <section aria-label="Filter by source" class="source-filter">
      <div class="source-stack">
      <div id="sourceFilters" class="filters"></div>
      <div class="group-tools" aria-label="Source groups">
        <label class="sr-only" for="sourceGroupSelect">Group</label>
        <span class="group-picker-prefix" aria-hidden="true">Group:</span>
        <select id="sourceGroupSelect" class="group-picker"></select>
        <details class="compact-menu group-menu">
          <summary class="compact-menu-trigger" aria-label="Group actions" title="Group actions">&#8942;</summary>
          <div class="compact-menu-panel">
            <button type="button" id="newSourceGroupBtn" class="compact-menu-item">New group</button>
            <button type="button" id="editSourceGroupBtn" class="compact-menu-item" disabled>Edit current group</button>
            <button type="button" id="setDefaultViewBtn" class="compact-menu-item">Set current as default</button>
            <button type="button" id="clearDefaultViewBtn" class="compact-menu-item" hidden>Clear default</button>
          </div>
        </details>
      </div>
      </div>
      <div class="view-stack">
      <div class="view-toggle" id="viewToggle" role="group" aria-label="Layout">
        <button type="button" class="view-btn" data-view="list">List</button>
        <button type="button" class="view-btn" data-view="columns">Columns</button>
      </div>
      <button type="button" id="backToStartBtn" class="back-to-start-btn" aria-label="Reset column pages" title="Reset column pages" hidden>&#8634;</button>
      </div>
      <div class="right-stack">
        <div class="saved-tools">
          <button type="button" id="savedFilterBtn" class="filter">Saved <span id="savedCount">0</span></button>
          <div id="savedActions" class="saved-actions" hidden>
            <button type="button" id="exportSavedBtn" class="saved-tool-btn">Export</button>
            <label class="saved-tool-btn import-saved-btn">Import<input id="importSavedInput" type="file" accept="application/json,.json" hidden /></label>
          </div>
        </div>
        <p id="count" class="count" aria-live="polite"></p>
      </div>
    </section>

    <section aria-label="Digest items" class="items-scroll">
      <ul id="itemList" class="item-list"></ul>
      <div id="columnBoard" class="column-board" hidden></div>
    </section>

    <footer>
      <span>Sorted by recency. The digest refreshes daily; the time above records the latest completed build. Saved articles stay on this browser until you remove them or clear site data.</span>
      <span id="bookmarkStatus" class="bookmark-status" aria-live="polite"></span>
    </footer>
  </main>

  <aside id="readingPane" class="reading-pane" aria-hidden="true">
    <div id="paneResizeHandle" class="pane-resize-handle" title="Drag to resize"></div>
    <div id="paneContent" class="pane-content"></div>
  </aside>
</div>
<dialog id="sourceGroupDialog" class="source-group-dialog" aria-labelledby="sourceGroupDialogTitle">
  <form id="sourceGroupForm" method="dialog">
    <div class="source-group-dialog-head">
      <h2 id="sourceGroupDialogTitle">New source group</h2>
      <button type="button" class="pane-close" id="closeSourceGroupDialogBtn" aria-label="Close">&times;</button>
    </div>
    <label class="group-name-field">Group name<input id="sourceGroupNameInput" name="group-name" maxlength="80" required autocomplete="off" placeholder="e.g. Poetry" /></label>
    <fieldset class="group-source-list">
      <legend>Sources in this group</legend>
      <div id="sourceGroupChoices"></div>
    </fieldset>
    <p id="sourceGroupError" class="group-form-error" hidden></p>
    <div class="source-group-dialog-actions">
      <button type="button" id="deleteSourceGroupBtn" class="saved-tool-btn danger-btn" hidden>Delete group</button>
      <span></span>
      <button type="button" id="cancelSourceGroupBtn" class="saved-tool-btn">Cancel</button>
      <button type="submit" class="saved-tool-btn primary-btn">Save group</button>
    </div>
  </form>
</dialog>
<script src="app.js"></script>
</body>
</html>
