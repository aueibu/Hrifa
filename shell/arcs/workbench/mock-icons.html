<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Properties &amp; Docker Icons</title>
  <style>
    :root {
      --panel-well: #1d1b19;
      --surface: #2a2826;
      --panel: #32302e;
      --panel-slot: #3a3836;
      --panel-body: #464442;
      --text: #e6e3df;
      --text-muted: #b4b1ad;

      --mark-orange: #f08c4b;
      --mark-blue: #6aa9ff;
      --mark-green: #58c973;
      --mark-violet: #b197fc;
      --mark-yellow: #e5b842;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      background: var(--surface);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 12px;
    }

    h1 {
      margin: 0 0 16px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 8px;
      max-width: 780px;
    }

    .card {
      background: var(--panel);
      border-radius: 4px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
    }

    .swatches {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .box {
      background: var(--panel-well);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .box.sm { width: 28px; height: 28px; }
    .box.lg { width: 52px; height: 52px; }
    .box.active { background: var(--panel-body); }

    svg {
      color: var(--icon-color, var(--text));
      fill: none;
      stroke: currentColor;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .sm svg { width: 16px; height: 16px; }
    .lg svg { width: 32px; height: 32px; }
  </style>
</head>
<body>
  <h1>Properties rail &amp; docker icons (15px actual / 32px enlarged)</h1>
  <div class="grid">
    <div class="card" style="--icon-color: var(--mark-violet);">
      <div class="label">Scene</div>
      <div class="swatches">
        <div class="box sm"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16"/></svg></div>
        <div class="box sm active"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16"/></svg></div>
        <div class="box lg"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16"/></svg></div>
      </div>
    </div>

    <div class="card" style="--icon-color: var(--mark-yellow);">
      <div class="label">Collection</div>
      <div class="swatches">
        <div class="box sm"><svg viewBox="0 0 24 24"><path d="M4 7h12M4 12h16M8 17h12"/></svg></div>
        <div class="box sm active"><svg viewBox="0 0 24 24"><path d="M4 7h12M4 12h16M8 17h12"/></svg></div>
        <div class="box lg"><svg viewBox="0 0 24 24"><path d="M4 7h12M4 12h16M8 17h12"/></svg></div>
      </div>
    </div>

    <div class="card" style="--icon-color: var(--mark-orange);">
      <div class="label">Object</div>
      <div class="swatches">
        <div class="box sm"><svg viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg></div>
        <div class="box sm active"><svg viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg></div>
        <div class="box lg"><svg viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg></div>
      </div>
    </div>

    <div class="card" style="--icon-color: var(--mark-blue);">
      <div class="label">Modifiers (~ in bracket)</div>
      <div class="swatches">
        <div class="box sm"><svg viewBox="0 0 24 24"><path d="M7 5H4v14h3M17 5h3v14h-3"/><path d="M7.5 12c1.5-3 3.2-3 4.5 0s3 3 4.5 0"/></svg></div>
        <div class="box sm active"><svg viewBox="0 0 24 24"><path d="M7 5H4v14h3M17 5h3v14h-3"/><path d="M7.5 12c1.5-3 3.2-3 4.5 0s3 3 4.5 0"/></svg></div>
        <div class="box lg"><svg viewBox="0 0 24 24"><path d="M7 5H4v14h3M17 5h3v14h-3"/><path d="M7.5 12c1.5-3 3.2-3 4.5 0s3 3 4.5 0"/></svg></div>
      </div>
    </div>

    <div class="card" style="--icon-color: var(--mark-green);">
      <div class="label">Data</div>
      <div class="swatches">
        <div class="box sm"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="1.5"/><circle cx="8" cy="15" r="1.3" fill="currentColor" stroke="none"/><circle cx="12" cy="9" r="1.3" fill="currentColor" stroke="none"/><circle cx="16" cy="12" r="1.3" fill="currentColor" stroke="none"/></svg></div>
        <div class="box sm active"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="1.5"/><circle cx="8" cy="15" r="1.3" fill="currentColor" stroke="none"/><circle cx="12" cy="9" r="1.3" fill="currentColor" stroke="none"/><circle cx="16" cy="12" r="1.3" fill="currentColor" stroke="none"/></svg></div>
        <div class="box lg"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="1.5"/><circle cx="8" cy="15" r="1.3" fill="currentColor" stroke="none"/><circle cx="12" cy="9" r="1.3" fill="currentColor" stroke="none"/><circle cx="16" cy="12" r="1.3" fill="currentColor" stroke="none"/></svg></div>
      </div>
    </div>
  </div>
</body>
</html>
