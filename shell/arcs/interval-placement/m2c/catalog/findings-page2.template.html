<title>Placement Catalog Findings</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@500;600&display=swap">
<style>
  /* Layout: one reading column; each finding is a panel with a sentence, a chart (one facet per cardinality), a legend
     and a table. Rule colors are fixed: equal centers = slot 1, shared range = slot 2. */
  :root {
    --bg: #f6f6f3; --surface: #ffffff; --line: #d9d9d2; --grid: #ececE6; --fg: #1d1f22; --muted: #5d6168;
    --c1: #2a78d6; --c2: #eb6834; --k1: #1baf7a; --k2: #eda100; --k3: #6250d6; --hi: #2a78d61f;
    --band: #eef1f7; --cband: #d6deee; --shared: #b4562a; --win: #b4562a; --s-a: #2f5fb3; --s-b: #2b7a4b; --s-c: #8a4fb0; --s-d: #b07a12; --s-e: #a8326e;
    --font-display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
    --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15171a; --surface: #1d2024; --line: #363b42; --grid: #2a2e34; --fg: #e8e9eb; --muted: #a2a7ae;
      --c1: #3987e5; --c2: #d95926; --k1: #199e70; --k2: #c98500; --k3: #9085e9; --hi: #3987e52e; --band: #222a37; --cband: #33405a; --shared: #f0996b; --win: #f0996b; --s-a: #8fb0ee; --s-b: #79c79a; --s-c: #c79ae6; --s-d: #e3b85a; --s-e: #ec8fbd; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #15171a; --surface: #1d2024; --line: #363b42; --grid: #2a2e34; --fg: #e8e9eb; --muted: #a2a7ae;
    --c1: #3987e5; --c2: #d95926; --k1: #199e70; --k2: #c98500; --k3: #9085e9; --hi: #3987e52e; --band: #222a37; --cband: #33405a; --shared: #f0996b; --win: #f0996b; --s-a: #8fb0ee; --s-b: #79c79a; --s-c: #c79ae6; --s-d: #e3b85a; --s-e: #ec8fbd; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 24px 64px;
  }
  .wrap { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
  h1 { font-family: var(--font-display); font-weight: 600; font-size: 1.8rem; margin: 0; text-wrap: balance; }
  h2 { font-family: var(--font-display); font-weight: 600; font-size: 1.2rem; margin: 0; text-wrap: balance; }
  p { margin: 0; max-width: 78ch; }
  .muted { color: var(--muted); }
  .stats { display: flex; flex-wrap: wrap; gap: 8px 24px; font-size: 0.9rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .stats b { color: var(--fg); font-family: var(--font-mono); font-weight: 500; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .facets { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 16px; }
  .facet { position: relative; min-width: 0; }
  .facet h3 { margin: 0 0 4px; font-size: 0.85rem; font-weight: 600; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
  svg.chart { width: 100%; height: auto; display: block; touch-action: none; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 0.85rem; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .sw { display: inline-block; width: 16px; height: 3px; border-radius: 2px; }
  .box { display: inline-block; width: 12px; height: 12px; border-radius: 3px; }
  .tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font-size: 0.8rem; font-variant-numeric: tabular-nums; box-shadow: 0 2px 8px rgba(0,0,0,0.14); white-space: nowrap; z-index: 2; }
  .tip .k { display: inline-block; width: 10px; height: 3px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
  details summary { cursor: pointer; font-size: 0.85rem; color: var(--muted); }
  .tablewrap { overflow-x: auto; }
  table { border-collapse: collapse; font-size: 0.8rem; font-variant-numeric: tabular-nums; }
  th, td { padding: 2px 10px 2px 0; text-align: right; white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 600; }
  .seg { display: flex; flex-direction: column; gap: 8px; }
  .segrow { display: grid; grid-template-columns: 9em minmax(0, 1fr); gap: 10px; align-items: center; font-size: 0.85rem; }
  .segbar { display: flex; height: 26px; gap: 2px; }
  .segbar div { border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; color: #fff; font-variant-numeric: tabular-nums; min-width: 0; overflow: hidden; }
  .segbar div.dark-text { color: #0b0b0b; }
  .toggle { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .toggle button, .toggle select { font: inherit; font-size: 0.85rem; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 6px; padding: 3px 10px; cursor: pointer; }
  .toggle button.on { border-color: var(--c1); color: var(--c1); }
  .toggle label { font-size: 0.85rem; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
  .toggle input[type=range] { width: 180px; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--c1); outline-offset: 2px; }
  .ramp { display: inline-block; width: 140px; height: 10px; border-radius: 3px; vertical-align: middle; }
  .callout { border-left: 3px solid var(--c1); padding: 6px 12px; background: var(--hi); border-radius: 0 6px 6px 0; max-width: 78ch; }
  table.ex td { font-family: var(--font-mono); font-size: 0.78rem; }
  table.ex td.names { text-align: left; font-family: var(--font-body); }
  table.ex tr.best td { font-weight: 600; }
  table.ex th, table.ex td { padding: 3px 14px 3px 0; }
  .filterbar { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); padding: 10px 0; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: 0.85rem; }
  .filterbar input[type=number] { font: inherit; width: 4.5em; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 6px; padding: 2px 6px; }
  .filterbar button { font: inherit; font-size: 0.85rem; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 6px; padding: 3px 10px; cursor: pointer; }
  .filterbar button.on { border-color: var(--c1); color: var(--c1); }
  .twocol { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); gap: 16px; }
</style>

<div class="wrap">
  <header style="display:flex;flex-direction:column;gap:10px">
    <h1>Placement Catalog Findings</h1>
    <p id="intro"></p>
    <div class="stats" id="stats"></div>
  </header>
  <div class="filterbar" id="filterbar"></div>
  <div id="panels" class="wrap" style="gap:20px"></div>
</div>

<script type="text/plain" id="coreSrc">/*CORE*/</script>
<script>/*MIXVIEW*/</script>
<script>
const D = /*DATA*/null;
const Z = /*ZPAIRS*/null;
const NS = D.n;
const MAXIV = D[NS[0]].meta.max, WMAX = D[NS[0]].meta.wmax;
const WR = { lo: 1, hi: WMAX }; // the page's window filter
const REDRAW = [];
const RULES = [['equal', 'equal centers', 'var(--c1)'], ['shared', 'shared center range', 'var(--c2)']];
const pct = (v) => (100 * v).toFixed(v < 0.1 ? 1 : 0) + '%';
const num = (d) => (v) => v.toFixed(d);
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
const NAMES = ['C', 'C♯', 'D', 'E♭', 'E', 'F', 'F♯', 'G', 'A♭', 'A', 'B♭', 'B'];
const noteName = (step) => NAMES[step % 12] + (2 + Math.floor(step / 12)); // step 0 = C2
const nList = (ns) => ns.length > 1 ? ns.slice(0, -1).join(', ') + ' and ' + ns[ns.length - 1] : String(ns[0]);

document.getElementById('intro').innerHTML = `Every set of ${nList(NS)} essential intervals with sizes 1 to ${MAXIV} steps, in every ordering, laid out in every window from the largest interval up to ${WMAX} steps, under both spacing rules: <b style="color:var(--c1)">equal centers</b> (the centers equally spaced, every chord fills its window) and <b style="color:var(--c2)">shared center range</b> (one center range set by the largest interval, the same center positions for every ordering). Roughness is measured from C2 unless a panel says otherwise. Hover any chart for exact values; each has a table. Five intervals are still being computed.`;
document.getElementById('stats').innerHTML = NS.map((n) =>
  `<span>${n} intervals: <b>${D[n].totals.sets.toLocaleString()}</b> sets, <b>${D[n].totals.placements.toLocaleString()}</b> placements, <b>${D[n].totals.chords.toLocaleString()}</b> distinct chords</span>`).join('');

function panel(title, text) {
  const el = document.createElement('section');
  el.className = 'panel';
  el.innerHTML = `<h2>${title}</h2><p class="muted">${text}</p>`;
  document.getElementById('panels').appendChild(el);
  return el;
}
function table(el, head, rows, label = 'Table', host = null) {
  const d = document.createElement('details');
  if (host) { d.open = !!host.querySelector('details[open]'); host.innerHTML = ''; el = host; }
  d.innerHTML = `<summary>${label}</summary><div class="tablewrap"><table><tr>${head.map((h) => `<th>${h}</th>`).join('')}</tr>${rows.map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join('')}</tr>`).join('')}</table></div>`;
  el.appendChild(d);
}
function legend(el, items) {
  const l = document.createElement('div');
  l.className = 'legend';
  l.innerHTML = items.map(([name, color, dash]) => `<span><i class="sw" style="background:${color};${dash ? 'background:repeating-linear-gradient(90deg,' + color + ' 0 5px,transparent 5px 8px)' : ''}"></i>${name}</span>`).join('');
  el.appendChild(l);
}

/** Line chart with one facet per n; series = [{name, color, dash, pts:{n:[[x,y]]}}]; shared y across facets.
 *  Follows the page's window filter (WR): only points with lo <= x <= hi are drawn; redrawn when the filter changes. */
function lineChart(el, series, { yFmt, yMin = 0, yMax, xLabel = 'window size (steps)', yLabel, ns = NS }) {
  const facets = document.createElement('div');
  facets.className = 'facets';
  el.appendChild(facets);
  const vis = (s, n) => (s.pts[n] || []).filter((p) => p[0] >= WR.lo && p[0] <= WR.hi);
  const draw = () => {
    facets.innerHTML = '';
    const all = series.flatMap((s) => ns.flatMap((n) => vis(s, n).map((p) => p[1])));
    if (!all.length) { facets.innerHTML = '<p class="muted" style="font-size:0.85rem">No data in this window range.</p>'; return; }
    const lo = yMin ?? Math.min(...all), hi = yMax ?? Math.max(...all) * 1.05;
    const W = 440, H = 240, L = 46, R = 70, T = 10, B = 34;
    for (const n of ns) {
      const xs = series.flatMap((s) => vis(s, n).map((p) => p[0]));
      if (!xs.length) continue;
      const x0 = Math.min(...xs), x1 = Math.max(...xs), span = x1 - x0;
      const step = span <= 12 ? 1 : span <= 24 ? 2 : span <= 48 ? 6 : 12;
      const x = (v) => L + ((v - x0) / (span || 1)) * (W - L - R);
      const y = (v) => T + (1 - (v - lo) / (hi - lo || 1)) * (H - T - B);
      let s = '';
      const ticks = 4;
      for (let i = 0; i <= ticks; i++) {
        const v = lo + ((hi - lo) * i) / ticks;
        s += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--font-mono)">${yFmt(v)}</text>`;
      }
      for (let v = Math.ceil(x0 / step) * step; v <= x1; v += step) s += `<text x="${x(v)}" y="${H - B + 16}" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="var(--font-mono)">${v}</text>`;
      s += `<text x="${(L + W - R) / 2}" y="${H - 3}" text-anchor="middle" font-size="11" fill="var(--muted)">${xLabel}</text>`;
      const ends = [];
      for (const sr of series) {
        const p = vis(sr, n);
        if (!p.length) continue;
        s += `<path d="${p.map((q, i) => (i ? 'L' : 'M') + x(q[0]) + ' ' + y(q[1])).join(' ')}" fill="none" stroke="${sr.color}" stroke-width="2" stroke-linejoin="round" ${sr.dash ? 'stroke-dasharray="6 4"' : ''}/>`;
        if (span <= 16 || p.length === 1) s += p.map((q) => `<circle cx="${x(q[0])}" cy="${y(q[1])}" r="4" fill="${sr.dash ? 'var(--surface)' : sr.color}" stroke="${sr.dash ? sr.color : 'var(--surface)'}" stroke-width="2"/>`).join('');
        ends.push({ y: y(p[p.length - 1][1]), name: sr.short || sr.name });
      }
      ends.sort((a, b) => a.y - b.y);
      for (let i = 1; i < ends.length; i++) if (ends[i].y - ends[i - 1].y < 13) ends[i].y = ends[i - 1].y + 13;
      for (const e of ends) s += `<text x="${W - R + 6}" y="${e.y + 4}" font-size="11" fill="var(--fg)">${esc(e.name)}</text>`;
      s += `<line class="cross" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="var(--muted)" stroke-dasharray="3 3" visibility="hidden"/>`;
      const f = document.createElement('div');
      f.className = 'facet';
      f.innerHTML = `<h3>${n} intervals</h3><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(yLabel)} against ${esc(xLabel)}, ${n} intervals">${s}</svg><div class="tip" hidden></div>`;
      const svg = f.querySelector('svg'), tip = f.querySelector('.tip'), cross = f.querySelector('.cross');
      svg.addEventListener('pointermove', (ev) => {
        const r = svg.getBoundingClientRect();
        const px = ((ev.clientX - r.left) / r.width) * W;
        const xv = Math.round(x0 + ((px - L) / (W - L - R)) * span);
        if (xv < x0 || xv > x1) { tip.hidden = true; cross.setAttribute('visibility', 'hidden'); return; }
        cross.setAttribute('x1', x(xv)); cross.setAttribute('x2', x(xv)); cross.setAttribute('visibility', 'visible');
        const rows = series.map((sr) => { const q = (sr.pts[n] || []).find((p) => p[0] === xv); return q ? `<div><i class="k" style="background:${sr.color}"></i>${esc(sr.name)}: <b>${yFmt(q[1])}</b></div>` : ''; }).join('');
        tip.innerHTML = `<div><b>${xLabel.startsWith('window') ? 'window' : xLabel.split(' (')[0]} ${xv}</b></div>${rows}`;
        tip.hidden = false;
        const left = (x(xv) / W) * r.width;
        tip.style.left = Math.max(0, Math.min(left + 12, r.width - tip.offsetWidth - 4)) + 'px';
        tip.style.top = '22px';
      });
      svg.addEventListener('pointerleave', () => { tip.hidden = true; cross.setAttribute('visibility', 'hidden'); });
      facets.appendChild(f);
    }
  };
  REDRAW.push(draw);
  draw();
}
const byRule = (rows, key, rule) => rows.filter((r) => r.rule === rule).map((r) => [r.window, r[key]]);
const perN = (f) => Object.fromEntries(NS.map((n) => [n, f(n)]));
const ruleSeries = (rowsByN, key, extra = {}) => RULES.map(([rule, name, color]) => ({ name, color, ...extra, pts: perN((n) => byRule(rowsByN[n], key, rule)) }));
const winsShown = () => {
  if (WR.hi - WR.lo <= 12) return Array.from({ length: WR.hi - WR.lo + 1 }, (_, i) => WR.lo + i);
  const step = WR.hi - WR.lo <= 24 ? 2 : 6;
  const out = [WR.lo];
  for (let w = Math.ceil((WR.lo + 1) / step) * step; w < WR.hi; w += step) out.push(w);
  out.push(WR.hi);
  return out;
};
/** A table whose columns are windows; redrawn when the window filter changes. */
const windowTable = (el, rowsOf, label = 'Table') => {
  const host = document.createElement('div');
  el.appendChild(host);
  const draw = () => { const ws = winsShown(); table(el, ['', ...ws.map((w) => `window ${w}`)], rowsOf(ws), label, host); };
  REDRAW.push(draw);
  draw();
};
const tableByWindow = (el, rowsByN, key, fmt) => windowTable(el, (ws) => {
  const rows = [];
  for (const n of NS) for (const [rule, name] of RULES) rows.push([`${n} intervals, ${name}`, ...ws.map((w) => { const r = rowsByN[n].find((q) => q.rule === rule && q.window === w); return r ? fmt(r[key]) : '—'; })]);
  return rows;
});
const get = (key) => perN((n) => D[n][key]);

// 1. merges
{
  const el = panel('How often notes merge', 'Share of placements where two interval ends land on the same note, by window size. Merges fall steadily as the window opens, and each extra interval adds collisions. In wide windows equal centers merges less than the shared range.');
  const rows = get('byWindow');
  lineChart(el, ruleSeries(rows, 'share_with_merge'), { yFmt: pct, yMax: 1, yLabel: 'share with a merge' });
  legend(el, RULES.map(([, n, c]) => [n, c]));
  tableByWindow(el, rows, 'share_with_merge', pct);
}
// 2. merge kinds
{
  const el = panel('How notes merge', 'Every pair of interval ends that land on the same note, by kind. Stacking: one interval\'s top on another\'s bottom. Nesting: two bottoms, or two tops, together. Equal centers mostly stacks; the shared range nests far more often.');
  const KINDS = [['stack', 'stacking (top on bottom)', 'var(--k1)', false], ['bottom', 'nesting: two bottoms', 'var(--k2)', true], ['top', 'nesting: two tops', 'var(--k3)', false]];
  const seg = document.createElement('div');
  seg.className = 'seg';
  const trows = [];
  for (const n of NS) for (const [rule, name] of RULES) {
    const r = D[n].mergeKinds.find((q) => q.rule === rule);
    const tot = r.stack + r.bottom + r.top;
    if (!tot) continue;
    seg.innerHTML += `<div class="segrow"><span>${n} intervals,<br>${name}</span><div class="segbar">${KINDS.map(([k, label, c, darkText]) => `<div class="${darkText ? 'dark-text' : ''}" style="flex:${r[k]};background:${c}" title="${label}: ${r[k].toLocaleString()} (${pct(r[k] / tot)})">${r[k] / tot > 0.04 ? pct(r[k] / tot) : ''}</div>`).join('')}</div></div>`;
    trows.push([`${n} intervals, ${name}`, ...KINDS.map(([k]) => `${r[k].toLocaleString()} (${pct(r[k] / tot)})`)]);
  }
  el.appendChild(seg);
  const l = document.createElement('div');
  l.className = 'legend';
  l.innerHTML = KINDS.map(([, label, c]) => `<span><i class="box" style="background:${c}"></i>${label}</span>`).join('');
  el.appendChild(l);
  table(el, ['', ...KINDS.map((k) => k[1])], trows);
}
// 3. note counts
{
  const el = panel('How many notes the chords end up with', 'Each placement starts with two notes per interval; every merge removes one. Share of placements by final note count, over all windows.');
  const seg = document.createElement('div');
  seg.className = 'seg';
  const trows = [];
  const shades = ['#104281', '#256abf', '#3987e5', '#6da7ec', '#9ec5f4', '#cde2fb', '#e3eefb'];
  for (const n of NS) for (const [rule, name] of RULES) {
    const rs = D[n].noteCounts.filter((q) => q.rule === rule).sort((a, b) => b.notes - a.notes);
    const tot = rs.reduce((s, q) => s + q.placements, 0);
    seg.innerHTML += `<div class="segrow"><span>${n} intervals,<br>${name}</span><div class="segbar">${rs.map((q, i) => `<div class="${i >= 3 ? 'dark-text' : ''}" style="flex:${q.placements};background:${shades[i] || shades[shades.length - 1]}" title="${q.notes} notes: ${pct(q.placements / tot)}">${q.placements / tot > 0.06 ? q.notes + ' · ' + pct(q.placements / tot) : ''}</div>`).join('')}</div></div>`;
    trows.push([`${n} intervals, ${name}`, rs.map((q) => `${q.notes} notes: ${pct(q.placements / tot)}`).join(' · ')]);
  }
  el.appendChild(seg);
  const l = document.createElement('div');
  l.className = 'legend';
  l.innerHTML = '<span>darkest = all notes distinct; each lighter step = one more merge</span>';
  el.appendChild(l);
  table(el, ['', 'by note count'], trows);
}
// 4. grid robustness and mirror
{
  const el = panel('Does the rule decide the chord, or the grid?', 'Solid: share of placements where no interval end falls on an exact half step, so rounding has no choice and the rule alone decides the chord. Dashed: share where the reversed ordering gives the exact mirror image. The shared range\'s fixed center grid keeps landing on half steps; its remaining mirror breaks are all intervals centered exactly on the middle of the window.');
  const rows = get('byWindow');
  const s = [...ruleSeries(rows, 'share_grid_robust').map((x) => ({ ...x, name: x.name + ': grid-robust', short: 'robust' })),
    ...ruleSeries(rows, 'share_mirror_ok').map((x) => ({ ...x, name: x.name + ': mirror exact', short: 'mirror', dash: true }))];
  lineChart(el, s, { yFmt: pct, yMax: 1, yLabel: 'share' });
  legend(el, [...RULES.map(([, n, c]) => [n + ': grid-robust', c]), ...RULES.map(([, n, c]) => [n + ': mirror exact', c, true])]);
  tableByWindow(el, rows, 'share_grid_robust', pct);
}
// 5. rounding twins
{
  const el = panel('Would a different rounding pick a different winner?', 'The catalog rounds a tie (an interval end on an exact half step) toward the middle of the window. It also stores the twins: the same placement with every tie rounded down, and with every tie rounded up. Share of interval sets, per window, whose smoothest ordering changes if the whole catalog used the down twin (solid) or the up twin (dashed). Where this is low the winner does not depend on the rounding convention.');
  const rows = get('winnerChange');
  const s = [...ruleSeries(rows, 'down').map((x) => ({ ...x, name: x.name + ': all ties down', short: 'down' })),
    ...ruleSeries(rows, 'up').map((x) => ({ ...x, name: x.name + ': all ties up', short: 'up', dash: true }))];
  lineChart(el, s, { yFmt: pct, yMax: null, yLabel: 'share whose winner changes' });
  legend(el, [...RULES.map(([, n, c]) => [n + ': all ties down', c]), ...RULES.map(([, n, c]) => [n + ': all ties up', c, true])]);
  tableByWindow(el, rows, 'down', pct);
}

// 10. simple vs compound mixes
{
  const C = D.compound;
  const el = panel('Simple intervals against their compound versions', `Some or all of a set's intervals made an octave larger: for 2 4 5, one compound (14 4 5, 2 16 5, 2 4 17), two (14 16 5, 14 4 17, 2 16 17) or all three (14 16 17). The sizes stop at ${MAXIV}, so only sets whose intervals are all ${MAXIV - 12} or smaller have every mix here; a second run with sizes 18 and 19 will add sets up to 7 (including 2 4 7). Each mixed placement is compared with the simple placement of the same ordering, in a window 12 steps wider and in the same window.`);
  const call = document.createElement('p');
  call.className = 'callout';
  call.innerHTML = '<b>All intervals compound: exactly predictable.</b> Checked on every pair in the catalog, both rules, every ordering: in a window 12 steps wider, the all-compound set gives the simple set\'s chord with every bottom note where it was and every top note an octave higher. Adding 12 to every interval and to the window leaves the gaps between interval centers unchanged and moves every center up 6, so bottoms stay and tops rise 12; the pitch classes are the same.<br><b>A mix (some compound, some not): mostly a different chord.</b> The intervals no longer grow together, so the centers move by different amounts and the pitch classes usually change. The charts show how often a mix keeps the simple chord\'s pitch classes.';
  el.appendChild(call);
  const KC = ['var(--k1)', 'var(--k2)', 'var(--k3)', 'var(--c1)'];
  const tg = document.createElement('div');
  tg.className = 'toggle';
  el.appendChild(tg);
  const host = document.createElement('div');
  el.appendChild(host);
  const st = { rule: 'equal' };
  const kName = (k, n) => (k === n ? `all ${n} compound` : `${k} of ${n} compound`);
  const drawCharts = () => {
    tg.innerHTML = '<span class="muted" style="font-size:0.85rem">rule:</span>' + RULES.map(([rule, name]) => `<button type="button" data-r="${rule}" class="${st.rule === rule ? 'on' : ''}">${name}</button>`).join('');
    tg.querySelectorAll('button').forEach((b) => b.addEventListener('click', () => { st.rule = b.dataset.r; drawCharts(); }));
    host.innerHTML = '';
    const maxK = Math.max(...NS);
    for (const [off, title] of [[12, 'Keeps the simple chord\'s pitch classes: mix in window W + 12'], [0, 'Keeps the simple chord\'s pitch classes: mix in the same window W']]) {
      const h = document.createElement('h3');
      h.style.cssText = 'margin:8px 0 4px;font-size:0.95rem';
      h.textContent = title;
      host.appendChild(h);
      const series = [];
      for (let k = 1; k <= maxK; k++) series.push({ name: `${k} compound`, color: KC[k - 1], pts: perN((n) => C[n].rows.filter((r) => r.k === k && r.rule === st.rule && r.offset === off).map((r) => [r.window, r.pc_same])) });
      lineChart(host, series, { yFmt: pct, yMax: 1, yLabel: 'share keeping the pitch classes', xLabel: 'simple window W' });
    }
    legend(host, Array.from({ length: maxK }, (_, i) => [`${i + 1} interval${i ? 's' : ''} compound`, KC[i]]));
  };
  drawCharts();
  const sumHost = document.createElement('div');
  el.appendChild(sumHost);
  const drawSum = () => {
  const trows = [];
  for (const n of NS) for (const [rule, name] of RULES) for (let k = 1; k <= n; k++) {
    const sum = (off, f) => { const rs = C[n].rows.filter((r) => r.k === k && r.rule === rule && r.offset === off && r.window >= WR.lo && r.window <= WR.hi); const P = rs.reduce((s, r) => s + r.pairs, 0); return P ? rs.reduce((s, r) => s + r[f] * r.pairs, 0) / P : NaN; };
    const sw = (off) => { const rs = C[n].rows.filter((r) => r.k === k && r.rule === rule && r.offset === off && r.window >= WR.lo && r.window <= WR.hi); return rs.length ? rs.reduce((s, r) => s + r.same_winner, 0) / rs.length : NaN; };
    trows.push([`${n} intervals, ${name}, ${kName(k, n)}`, pct(sum(12, 'pc_same')), pct(sum(12, 'exact')), pct(sum(0, 'pc_same')),
      `${sum(12, 'rough_s').toFixed(2)} → ${sum(12, 'rough_v').toFixed(2)}`, `${sum(12, 'harm_s').toFixed(2)} → ${sum(12, 'harm_v').toFixed(2)}`, pct(sw(12))]);
  }
  table(el, ['', 'same pitch classes (W + 12)', 'tops up an octave, nothing else moved (W + 12)', 'same pitch classes (same W)', 'roughness simple → mix (W + 12)', 'harmonicity simple → mix (W + 12)', 'same smoothest ordering (W + 12)'], trows, `Table: simple windows ${WR.lo} to ${WR.hi} together`, sumHost);
  };
  REDRAW.push(drawSum);
  drawSum();

  // lookup: one map per mix and a side-by-side compare (the browse page's map and chord columns, shared mixview.js)
  const ex = document.createElement('div');
  ex.style.cssText = 'display:flex;flex-direction:column;gap:10px;margin-top:10px';
  ex.innerHTML = '<h3 style="margin:0;font-size:1rem;font-family:var(--font-display)">Look up a set: every mix, every ordering, every window</h3><div class="toggle" id="mx-controls"></div><div id="mx-out" style="display:flex;flex-direction:column;gap:10px"></div><p class="muted" style="font-size:0.85rem">From the catalog: 2 and 3 intervals, simple windows up to 24. The browse page builds the same view for any set you type, including 2 4 7, and plays the chords.</p>';
  el.appendChild(ex);
  const XN = NS.filter((n) => C[n].explorer && C[n].explorer.length);
  const xs = { n: XN.includes(3) ? 3 : XN[0], set: '2 4 5', rule: 'equal', metric: 'rough', off: 12, sel: null };
  const ctl = ex.querySelector('#mx-controls'), out = ex.querySelector('#mx-out');
  const XMETRICS = { rough: ['roughness', 1, (v) => v.toFixed(3)], harm: ['harmonicity', -1, (v) => v.toFixed(3)] };
  const models = new Map();
  const modelOf = (n, set) => {
    const key = n + '|' + set;
    if (models.has(key)) return models.get(key);
    const e = C[n].explorer.find((q) => q.set === set);
    const simple = e.set.split(' ').map(Number);
    let mismatch = 0;
    const variants = e.variants.slice().sort((a, b) => a.k - b.k).map((v) => {
      const vs = v.set.split(' ').map(Number), pool = vs.slice(), comp = [];
      for (const x of simple) { const i = pool.indexOf(x); if (i >= 0) pool.splice(i, 1); else comp.push(x); }
      const P = v.rows.map((r) => {
        const rule = r[0] ? 'shared' : 'equal', order = r[1].split(' ').map(Number);
        const pl = MIX.place(rule, order, r[2]);
        if (pl.notes.join(' ') !== r[3]) mismatch++;
        return { rule, order: r[1], W: r[2], ...pl, rough: r[4], harm: r[5] };
      });
      return { set: vs, k: v.k, comp, P };
    });
    if (mismatch) console.warn(`mix view: ${mismatch} placements differ from the catalog for ${set}`);
    const windows = [...new Set(variants[0].P.map((p) => p.W))].filter((w) => w <= 24).sort((a, b) => a - b);
    const m = { variants, windows };
    models.set(key, m);
    return m;
  };
  const drawEx = () => {
    const list = C[xs.n].explorer;
    if (!list.find((e) => e.set === xs.set)) xs.set = list[0].set;
    ctl.innerHTML = XN.map((n) => `<button type="button" data-n="${n}" class="${xs.n === n ? 'on' : ''}">${n} intervals</button>`).join('') +
      `<label>set <select id="mx-set">${list.map((q) => `<option ${q.set === xs.set ? 'selected' : ''}>${q.set}</option>`).join('')}</select></label>` +
      RULES.map(([r, name]) => `<button type="button" data-rule="${r}" class="${xs.rule === r ? 'on' : ''}">${name}</button>`).join('') +
      Object.entries(XMETRICS).map(([k, [l]]) => `<button type="button" data-m="${k}" class="${xs.metric === k ? 'on' : ''}">${l}</button>`).join('') +
      [[12, 'mixes in windows 12 wider'], [0, 'mixes in the same windows']].map(([o, l]) => `<button type="button" data-off="${o}" class="${xs.off === o ? 'on' : ''}">${l}</button>`).join('');
    ctl.querySelectorAll('[data-n]').forEach((b) => b.addEventListener('click', () => { xs.n = +b.dataset.n; xs.sel = null; drawEx(); }));
    ctl.querySelectorAll('[data-rule]').forEach((b) => b.addEventListener('click', () => { xs.rule = b.dataset.rule; drawEx(); }));
    ctl.querySelectorAll('[data-m]').forEach((b) => b.addEventListener('click', () => { xs.metric = b.dataset.m; drawEx(); }));
    ctl.querySelectorAll('[data-off]').forEach((b) => b.addEventListener('click', () => { xs.off = +b.dataset.off; drawEx(); }));
    ctl.querySelector('#mx-set').addEventListener('change', (ev) => { xs.set = ev.target.value; xs.sel = null; drawEx(); });
    const [mName, dir, fmt] = XMETRICS[xs.metric];
    MIX.render(out, modelOf(xs.n, xs.set), {
      rule: xs.rule, ruleName: RULES.find((r) => r[0] === xs.rule)[1], metric: xs.metric, dir, fmt, metricName: mName, offset: xs.off,
      name: noteName, colors: ['var(--s-a)', 'var(--s-b)', 'var(--s-c)', 'var(--s-d)', 'var(--s-e)'], sel: xs.sel,
      onSelect: (sel) => { xs.sel = sel; drawEx(); },
      scores: [['rough', 'roughness', (v) => v.toFixed(3)], ['harm', 'harmonicity', (v) => v.toFixed(3)]],
    });
  };
  drawEx();
}
// 11. heatmap, with a zoom into the sets behind a cell
{
  const el = panel('Where the smooth chords are', 'Average roughness of the smoothest ordering, by the largest interval in the set (rows) and the window size (columns). Darker is rougher. The empty triangle is where the window is smaller than the largest interval. Click a cell to zoom in on the interval sets behind it.');
  const tg = document.createElement('div');
  tg.className = 'toggle';
  el.appendChild(tg);
  const host = document.createElement('div');
  host.className = 'facets';
  el.appendChild(host);
  const lg = el.appendChild(Object.assign(document.createElement('div'), { className: 'legend heatlegend' }));
  const zoom = el.appendChild(Object.assign(document.createElement('div'), { className: 'zoom' }));
  zoom.style.cssText = 'display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:12px;position:relative';
  const state = { n: NS.includes(3) ? 3 : NS[0], cell: null, show: 'smooth', pick: null };
  const stops = [[205, 226, 251], [158, 197, 244], [109, 167, 236], [57, 135, 229], [37, 106, 191], [24, 79, 149], [16, 66, 129]];
  const ramp = (t) => {
    const p = Math.max(0, Math.min(1, t)) * (stops.length - 1), i = Math.min(stops.length - 2, Math.floor(p)), f = p - i;
    const c = stops[i].map((v, k) => Math.round(v + (stops[i + 1][k] - v) * f));
    return `rgb(${c.join(',')})`;
  };
  const draw = () => {
    tg.innerHTML = NS.map((n) => `<button type="button" class="${state.n === n ? 'on' : ''}" data-n="${n}">${n} intervals</button>`).join('');
    tg.querySelectorAll('button').forEach((b) => b.addEventListener('click', () => { state.n = +b.dataset.n; state.cell = null; state.pick = null; draw(); }));
    const cells = D[state.n].heat.filter((c) => c.window >= WR.lo && c.window <= WR.hi);
    const vals = cells.map((c) => c.best);
    const lo = Math.min(...vals), hi = Math.max(...vals);
    host.innerHTML = '';
    for (const [rule, name] of RULES) {
      const NW = WR.hi - WR.lo + 1, cw = Math.max(8, Math.min(28, Math.floor(480 / NW))), chh = 12, L = 34, T = 8, W = L + NW * cw + 10, H = T + MAXIV * chh + 30;
      let s = '';
      for (const c of cells.filter((q) => q.rule === rule)) {
        const on = state.cell && state.cell.rule === rule && state.cell.L === c.largest && state.cell.W === c.window;
        s += `<rect data-rule="${rule}" data-l="${c.largest}" data-w="${c.window}" style="cursor:pointer" x="${L + (c.window - WR.lo) * cw}" y="${T + (MAXIV - c.largest) * chh}" width="${cw - 1}" height="${chh - 1}" fill="${ramp((c.best - lo) / (hi - lo))}" ${on ? 'stroke="var(--win)" stroke-width="2"' : ''}><title>largest ${c.largest}, window ${c.window}: ${c.best.toFixed(3)} (click to zoom in)</title></rect>`;
      }
      for (const v of [1, 6, 12, MAXIV]) s += `<text x="${L - 4}" y="${T + (MAXIV - v) * chh + 10}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="var(--font-mono)">${v}</text>`;
      const hs = NW <= 16 ? 1 : NW <= 30 ? 2 : NW <= 48 ? 6 : 12;
      for (let v = Math.ceil(WR.lo / hs) * hs; v <= WR.hi; v += hs) s += `<text x="${L + (v - WR.lo) * cw + cw / 2}" y="${T + MAXIV * chh + 14}" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="var(--font-mono)">${v}</text>`;
      s += `<text x="${L + (NW / 2) * cw}" y="${H - 2}" text-anchor="middle" font-size="11" fill="var(--muted)">window size</text>`;
      const f = document.createElement('div');
      f.className = 'facet';
      f.innerHTML = `<h3>${name} (rows: largest interval)</h3><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Roughness heatmap, ${name}, ${state.n} intervals">${s}</svg>`;
      f.querySelector('svg').addEventListener('click', (ev) => {
        const t = ev.target;
        if (!t.dataset || !t.dataset.rule) return;
        state.cell = { rule: t.dataset.rule, L: +t.dataset.l, W: +t.dataset.w };
        state.pick = null;
        draw();
        zoom.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      });
      host.appendChild(f);
    }
    lg.innerHTML = `<span>${lo.toFixed(2)} smooth <i class="ramp" style="background:linear-gradient(90deg,${ramp(0)},${ramp(0.5)},${ramp(1)})"></i> rough ${hi.toFixed(2)}</span><span>hover a cell for its value; click it to zoom in</span>`;
    drawZoom();
  };

  // the zoom: every set with that largest interval, windows W-6 .. W+6, colored by its smoothest ordering's roughness
  const drawZoom = () => {
    if (!state.cell) { zoom.innerHTML = '<p class="muted" style="font-size:0.9rem">Click a heatmap cell to see the interval sets behind it.</p>'; return; }
    const { rule, L, W: Wc } = state.cell, B = D[state.n].best;
    const ruleName = RULES.find((r) => r[0] === rule)[1];
    const w0 = Math.max(L, Wc - 6), w1 = Math.min(WMAX, Wc + 6);
    const wins = Array.from({ length: w1 - w0 + 1 }, (_, i) => w0 + i);
    const roughAt = (i, w) => { const v = B[rule][i][w - B.w0[i]]; return v === undefined || v === null ? null : v / 1000; };
    const ids = B.sets.map((_, i) => i).filter((i) => B.w0[i] === L || (+B.sets[i].split(' ').pop() === L));
    ids.sort((a, b) => roughAt(a, Wc) - roughAt(b, Wc));
    const N = 40;
    const shown = state.show === 'all' ? ids : state.show === 'rough' ? ids.slice(-N).reverse() : ids.slice(0, N);
    const vals = shown.flatMap((i) => wins.map((w) => roughAt(i, w)).filter((v) => v !== null));
    const lo = Math.min(...vals), hi = Math.max(...vals);
    const cw = 30, rh = 16, T = 20, labelW = 16 + 8 * Math.max(...shown.map((i) => B.sets[i].length));
    const W = labelW + wins.length * cw + 8, H = T + shown.length * rh + 4;
    let s = '';
    wins.forEach((w, j) => { s += `<text x="${labelW + j * cw + cw / 2}" y="${T - 6}" text-anchor="middle" font-size="10" fill="${w === Wc ? 'var(--fg)' : 'var(--muted)'}" font-weight="${w === Wc ? 600 : 400}" font-family="var(--font-mono)">${w}</text>`; });
    shown.forEach((i, r) => {
      const y = T + r * rh;
      s += `<text x="${labelW - 8}" y="${y + 12}" text-anchor="end" font-size="11" fill="var(--fg)" font-family="var(--font-mono)">${B.sets[i]}</text>`;
      wins.forEach((w, j) => {
        const v = roughAt(i, w);
        if (v === null) return;
        const sel = state.pick && state.pick.i === i && state.pick.w === w;
        s += `<rect data-i="${i}" data-w="${w}" style="cursor:pointer" x="${labelW + j * cw + 1}" y="${y + 1}" width="${cw - 2}" height="${rh - 2}" rx="2" fill="${ramp((v - lo) / (hi - lo || 1))}" ${sel ? 'stroke="var(--fg)" stroke-width="2"' : w === Wc ? 'stroke="var(--win)" stroke-width="1"' : ''}><title>${B.sets[i]}, window ${w}: ${v.toFixed(3)}, smoothest ordering ${B.ords[i][B[rule + 'Ord'][i][w - B.w0[i]]]}</title></rect>`;
      });
    });
    const opts = [['smooth', `${Math.min(N, ids.length)} smoothest`], ['rough', `${Math.min(N, ids.length)} roughest`], ['all', `all ${ids.length}`]];
    zoom.innerHTML = `<h3 style="margin:0;font-size:1rem;font-family:var(--font-display)">${ruleName}: sets whose largest interval is ${L}, windows ${w0}–${w1}</h3>` +
      `<p class="muted" style="font-size:0.85rem">Each cell is the roughness of that set's smoothest ordering in that window; rows sorted smoothest first at window ${Wc} (outlined). Colors use this zoom's own range, ${lo.toFixed(2)} to ${hi.toFixed(2)}, so small differences show. Click a cell to see its chord.</p>` +
      `<div class="toggle">${opts.map(([k, l]) => `<button type="button" data-show="${k}" class="${state.show === k ? 'on' : ''}">${l}</button>`).join('')}</div>` +
      `<div style="overflow:auto;max-height:560px;min-width:0"><svg class="chart" viewBox="0 0 ${W} ${H}" style="max-width:${W * 1.4}px" role="img" aria-label="Zoom: sets with largest interval ${L} by window">${s}</svg></div><div id="zoom-tile" style="border-top:1px solid var(--line);padding-top:12px"></div>`;
    zoom.querySelectorAll('[data-show]').forEach((b) => b.addEventListener('click', () => { state.show = b.dataset.show; drawZoom(); }));
    zoom.querySelector('svg').addEventListener('click', (ev) => {
      const t = ev.target;
      if (!t.dataset || t.dataset.i === undefined) return;
      state.pick = { i: +t.dataset.i, w: +t.dataset.w };
      state.tileRule = rule;
      state.tileSel = null;
      drawZoom();
      zoom.querySelector('#zoom-tile').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    });
    drawTile();
  };

  // ---- one tile: every chord that sits in it (human, 2026-11-21) ----
  // A zoom cell is one set in one window; it holds one chord per ordering of the set. The page builds them all with the
  // catalog's code (the browse page's worker: same placement rules, same roughness and harmonicity at C2) and shows
  // them side by side, smoothest first, with a table; the rule can be switched without leaving the tile.
  const TILE = new Map(); // 'set|window' -> worker result
  const pending = new Map(); // job id -> 'set|window'
  let jobId = 0;
  const tileWorker = new Worker(URL.createObjectURL(new Blob([document.getElementById('coreSrc').textContent], { type: 'text/javascript' })));
  tileWorker.onmessage = (ev) => {
    const m = ev.data;
    if (m.type !== 'done') return;
    TILE.set(pending.get(m.id), m);
    pending.delete(m.id);
    drawTile();
  };
  const drawTile = () => {
    const host = zoom.querySelector('#zoom-tile');
    if (!host) return;
    if (!state.pick) { host.innerHTML = '<p class="muted" style="font-size:0.85rem">Click a cell to open it and see every chord in it: one per ordering of that set, in that window.</p>'; return; }
    const B = D[state.n].best, { i, w } = state.pick, set = B.sets[i], key = `${set}|${w}`;
    const res = TILE.get(key);
    if (!res) {
      if (![...pending.values()].includes(key)) {
        const id = ++jobId;
        pending.set(id, key);
        tileWorker.postMessage({ id, intervals: set.split(' ').map(Number), wmin: w, wmax: w, base: 36 });
      }
      host.innerHTML = `<p class="muted" style="font-size:0.85rem">Building and scoring every ordering of ${set} in window ${w}…</p>`;
      return;
    }
    const rule = state.tileRule;
    const ords = B.ords[i];
    const cellOrd = ords[B[rule + 'Ord'][i][w - B.w0[i]]];
    const rows = res.placements.filter((p) => p.rule === rule && p.W === w).map((p) => {
      const sc = res.scores[p.key];
      return { ...p, rough: sc.rough, harm: sc.harm, merges: p.spans.length * 2 - p.notes.length };
    });
    rows.sort((a, b) => a.rough - b.rough || ords.indexOf(a.order) - ords.indexOf(b.order));
    const firstOf = new Map();
    for (const r of rows) if (!firstOf.has(r.key)) firstOf.set(r.key, r.order);
    const sel = rows.find((r) => r.order === state.tileSel) || rows.find((r) => r.order === cellOrd) || rows[0];
    state.tileSel = sel.order;
    const rl = rows[0].rough, rh = rows[rows.length - 1].rough;
    const HI = Math.max(24, w), step = Math.max(5, Math.min(10, 360 / HI)), top = 10;
    const g = { HI, H: top + HI * step + 10, y: (m) => top + (HI - m) * step };
    const sizes = [...new Set(set.split(' ').map(Number))];
    const colors = ['var(--s-a)', 'var(--s-b)', 'var(--s-c)', 'var(--s-d)', 'var(--s-e)'];
    const colorOf = (sz) => colors[sizes.indexOf(sz)] || 'var(--muted)';
    let ax = `<svg width="38" height="${g.H}" aria-hidden="true">`;
    for (let m = 0; m <= HI; m += 12) ax += `<text x="34" y="${g.y(m) + 4}" text-anchor="end" font-size="11" font-family="var(--font-mono)" fill="var(--muted)">${noteName(m)}</text>`;
    ax += '</svg>';
    const mono = 'font-family:var(--font-mono)';
    const col = (r) => {
      const on = r === sel, inCell = r.order === cellOrd;
      return `<div data-ord="${r.order}" title="${r.order}: ${r.notes.map(noteName).join(' ')}, roughness ${r.rough.toFixed(3)}" style="cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 2px;border-radius:6px;border:2px solid ${on ? 'var(--fg)' : 'transparent'}">` +
        MIX.colSvg({ ...r, W: w }, g, colorOf) +
        `<span style="${mono};font-size:0.75rem">${r.order}</span>` +
        `<span style="display:block;width:40px;height:6px;border-radius:3px;background:${ramp((r.rough - rl) / (rh - rl || 1))}"></span>` +
        `<span class="muted" style="${mono};font-size:0.72rem">${r.rough.toFixed(3)}</span>` +
        `<span style="font-size:0.68rem;color:var(--win);min-height:1em">${inCell ? 'in the cell' : ''}</span>` +
        `<span data-zkey="${r.key}" title="other input sets that make exactly this chord" style="font-size:0.68rem;color:var(--fg);font-weight:600;min-height:1em"></span></div>`;
    };
    const distinct = firstOf.size;
    const tr = (r, k) => `<tr data-ord="${r.order}" style="cursor:pointer;${r === sel ? 'background:var(--hi)' : ''}"><td>${k + 1}</td><td style="${mono}">${r.order}${r.order === cellOrd ? ' <span style="color:var(--win)">●</span>' : ''}</td>` +
      `<td style="${mono}">${r.notes.map(noteName).join(' ')}</td><td style="${mono}">${r.rough.toFixed(3)}</td><td style="${mono}">${r.harm.toFixed(3)}</td><td>${r.merges}</td>` +
      `<td class="muted">${firstOf.get(r.key) !== r.order ? 'same chord as ' + firstOf.get(r.key) : ''}</td></tr>`;
    host.innerHTML =
      `<div style="display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline"><h3 style="margin:0;font-size:1rem;font-family:var(--font-display)">Every chord in this tile: ${set} in window ${w}</h3>` +
      `<div class="toggle">${RULES.map(([k, l]) => `<button type="button" data-trule="${k}" class="${k === rule ? 'on' : ''}">${l}</button>`).join('')}` +
      (TRAIL.length ? `<button type="button" data-back>← back to ${TRAIL[TRAIL.length - 1].label}</button>` : '') + `</div></div>` +
      `<p class="muted" style="font-size:0.85rem">${rows.length} orderings, ${distinct} different chord${distinct === 1 ? '' : 's'}, smoothest first. The cell shows the smoothest one (marked “in the cell”). The bar under each chord is its roughness on this tile's own range, ${rl.toFixed(3)} to ${rh.toFixed(3)}; “+N sets” means N other input sets make exactly that chord. Click a chord or a table row to read it.</p>` +
      `<div style="overflow-x:auto"><div style="display:flex;align-items:flex-start;gap:2px;width:max-content"><div style="position:sticky;left:0;background:var(--surface);padding-top:6px">${ax}</div>${rows.map(col).join('')}</div></div>` +
      `<div style="display:flex;flex-direction:column;gap:3px;margin:10px 0;font-size:0.9rem"><div class="muted" style="font-size:0.78rem;font-weight:600;letter-spacing:0.05em;text-transform:uppercase">ordering ${sel.order} · ${RULES.find((r) => r[0] === rule)[1]}</div>` +
      `<div style="${mono}">${sel.notes.map(noteName).join(' ')}</div>` +
      `<div class="muted" style="display:flex;flex-wrap:wrap;gap:2px 14px">${sel.spans.map((sp) => `<span>${sp.size}: ${noteName(sp.low)}–${noteName(sp.low + sp.size)}</span>`).join('')}</div>` +
      `<div class="muted">roughness <b style="color:var(--fg)">${sel.rough.toFixed(3)}</b> · harmonicity <b style="color:var(--fg)">${sel.harm.toFixed(3)}</b> · merged notes <b style="color:var(--fg)">${sel.merges}</b></div></div>` +
      `<div class="tablewrap"><table><thead><tr><th>#</th><th>ordering</th><th>notes</th><th>roughness</th><th>harmonicity</th><th>merged notes</th><th></th></tr></thead><tbody>${rows.map(tr).join('')}</tbody></table></div>` +
      `<div id="tile-z" data-key="${sel.key}" style="margin-top:14px;display:flex;flex-direction:column;gap:6px"></div>`;
    host.querySelectorAll('[data-trule]').forEach((b) => b.addEventListener('click', () => { state.tileRule = b.dataset.trule; drawTile(); }));
    host.querySelectorAll('[data-ord]').forEach((el) => el.addEventListener('click', () => { state.tileSel = el.dataset.ord; drawTile(); }));
    const back = host.querySelector('[data-back]');
    if (back) back.addEventListener('click', () => { Object.assign(state, TRAIL.pop().state); draw(); });
    askZ(sel.notes);
    rows.forEach((r) => askZ(r.notes));
    paintZ();
  };

  // ---- same chord, other sets (human, 2026-11-21: "a semi-arbitrary type of z relation") ----
  // MIX.producers searches every set of 2..4 intervals (sizes up to the catalog's max, windows up to its max) whose
  // placement is exactly the chord's notes; it runs in its own worker (up to ~2 s for an 8-note chord).
  const mixSrc = [...document.scripts].find((s) => s.textContent.includes('const MIX = (() =>')).textContent;
  const zWorker = new Worker(URL.createObjectURL(new Blob([mixSrc + '\nself.onmessage = (e) => self.postMessage({ key: e.data.key, res: MIX.producers(e.data.notes, e.data.o) });'], { type: 'text/javascript' })));
  const ZR = new Map(), zAsked = new Set(), TRAIL = [];
  zWorker.onmessage = (ev) => { ZR.set(ev.data.key, ev.data.res); paintZ(); };
  const askZ = (notes) => {
    const key = notes.join(' ');
    if (ZR.has(key) || zAsked.has(key)) return;
    zAsked.add(key);
    zWorker.postMessage({ key, notes, o: { ns: NS, max: MAXIV, wmax: WMAX } });
  };
  const goTo = (p) => {
    if (state.pick) {
      const B0 = D[state.n].best;
      TRAIL.push({ label: `${B0.sets[state.pick.i]} · window ${state.pick.w}`, state: JSON.parse(JSON.stringify({ n: state.n, cell: state.cell, pick: state.pick, tileRule: state.tileRule, tileSel: state.tileSel, show: state.show })) });
    }
    const i = D[p.n].best.sets.indexOf(p.set);
    Object.assign(state, { n: p.n, cell: { rule: p.rule, L: +p.set.split(' ').pop(), W: p.W }, pick: { i, w: p.W }, tileRule: p.rule, tileSel: p.order, show: 'all' });
    draw();
    zoom.querySelector('#zoom-tile').scrollIntoView({ behavior: 'smooth', block: 'start' });
  };
  const paintZ = () => {
    const host = zoom.querySelector('#zoom-tile');
    if (!host || !state.pick) return;
    const set = D[state.n].best.sets[state.pick.i], me = `${state.n}:${set}`;
    const others = (r) => new Set(r.filter((p) => `${p.n}:${p.set}` !== me).map((p) => `${p.n}:${p.set}`)).size;
    host.querySelectorAll('[data-zkey]').forEach((el) => {
      const r = ZR.get(el.dataset.zkey);
      const c = r ? others(r) : 0;
      el.textContent = !r ? '…' : c ? `+${c} set${c === 1 ? '' : 's'}` : '';
    });
    const zh = host.querySelector('#tile-z');
    if (!zh) return;
    const r = ZR.get(zh.dataset.key);
    const head = '<h4 style="margin:0;font-size:0.95rem;font-family:var(--font-display)">Same chord, other input sets</h4>';
    if (!r) { zh.innerHTML = head + '<p class="muted" style="font-size:0.85rem">Looking for every other set that makes this chord…</p>'; return; }
    const groups = new Map();
    for (const p of r) (groups.get(`${p.n}:${p.set}`) || groups.set(`${p.n}:${p.set}`, []).get(`${p.n}:${p.set}`)).push(p);
    const sel = { rule: state.tileRule, order: state.tileSel, W: state.pick.w };
    const list = [...groups].sort(([a], [b]) => (+a.split(':')[0] - +b.split(':')[0]) || a.localeCompare(b, undefined, { numeric: true }));
    const links = [];
    // one button per rule and window; the orderings that land on the chord are listed beside it, the first one opens
    const btns = (ps) => {
      const byRW = new Map();
      for (const p of ps) {
        if (p.n === state.n && p.set === set && p.rule === sel.rule && p.W === sel.W && p.order === sel.order) continue;
        const k = `${p.rule}|${p.W}`;
        (byRW.get(k) || byRW.set(k, []).get(k)).push(p);
      }
      return [...byRW.values()].map((g) => {
        const p = g[0], can = D[p.n] && D[p.n].best.sets.includes(p.set);
        links.push(p);
        const txt = `${RULES.find((x) => x[0] === p.rule)[1]} · window ${p.W}`;
        const ords = g.length <= 3 ? `ordering${g.length > 1 ? 's' : ''} ${g.map((x) => x.order).join(', ')}` : `${g.length} orderings`;
        return (can ? `<button type="button" data-go="${links.length - 1}">${txt}</button>` : `<span style="font-size:0.85rem">${txt}</span>`) +
          `<span class="muted" style="font-size:0.8rem;font-family:var(--font-mono)">${ords}</span>`;
      });
    };
    const n = others(r);
    zh.innerHTML = head +
      `<p class="muted" style="font-size:0.85rem">${n ? `Exactly these notes are also the result of <b style="color:var(--fg)">${n}</b> other input set${n === 1 ? '' : 's'}` : 'No other input set makes exactly these notes'} (searched: ${NS[0]}–${NS[NS.length - 1]} intervals, sizes 1–${MAXIV}, windows up to ${WMAX}). Click one to open its tile.</p>` +
      `<div style="display:flex;flex-direction:column;gap:4px">${list.map(([k, ps]) => {
        const bs = btns(ps);
        if (!bs.length) return '';
        const mine = k === me;
        return `<div style="display:flex;gap:10px;align-items:baseline;flex-wrap:wrap"><span style="font-family:var(--font-mono);min-width:10ch;font-weight:${mine ? 400 : 600}">${ps[0].set}</span>` +
          `<span class="toggle">${mine ? '<span class="muted" style="font-size:0.85rem">this set, also as</span>' : ''}${bs.join('')}</span></div>`;
      }).join('')}</div>`;
    zh.querySelectorAll('[data-go]').forEach((b) => b.addEventListener('click', () => goTo(links[+b.dataset.go])));
  };
  window.openTile = goTo; // other panels open a set's tile: { n, set, rule, order, W }
  REDRAW.push(draw);
  draw();
}

// 12. Z-related chords with register kept (human, 2026-11-21: "a meta level z-relation where the entire structure is
// considered (not just stopping with the octave equivalence)"): the same multiset of all pairwise distances in steps,
// but not a transposition or mirror of each other (homometric sets). Data: extract-zpairs.mjs.
if (Z && Z.groups.length) {
  const el = panel('Z-related chords, register kept',
    `Two chords are Z-related here when every distance between two of their notes, counted in steps with no octave reduction, is the same, yet neither is a transposition or mirror image of the other. Out of ${Z.classes.toLocaleString()} different chords with 6 or more notes from the ${Z.sources.length === 2 ? '3- and 4-interval' : 'scanned'} sets, ${Z.groups.length} pairs are Z-related. Fewer than 6 notes cannot be: on a line of pitches the distances pin down smaller chords.`);
  const sizesOf = (c) => [...new Set(c.producers.map((p) => p.n))];
  const k = (g) => g.chords[0].shape.split(' ').length;
  // the counting rule, as a table from the data
  const rule = document.createElement('div');
  rule.className = 'muted';
  rule.style.cssText = 'font-size:0.88rem;display:flex;flex-direction:column;gap:6px';
  const cnt = {};
  const who = (c) => { const s = sizesOf(c); return s.length > 1 ? `${s.join(' or ')} intervals` : `only ${s[0]} intervals`; };
  for (const g of Z.groups) { const key = `${k(g)}|${g.chords.map(who).sort().join(' / ')}`; cnt[key] = (cnt[key] || 0) + 1; }
  rule.innerHTML = `<p style="margin:0">Why one chord can come from a 3-interval set and a 4-interval set: n intervals have 2n ends, so a chord of k notes made from n intervals has exactly <b style="color:var(--fg)">2n − k merged notes</b>. A 6-note chord comes from 3 intervals with nothing merged, or from 4 intervals with two ends landing on notes already there. 7- and 8-note chords need 4 intervals (1 and 0 merged). This holds for every producer below.</p>` +
    `<div class="tablewrap"><table><tr><th>notes</th><th>sets that can make chord A / chord B</th><th>pairs</th></tr>${Object.entries(cnt).map(([key, v]) => { const [kk, w] = key.split('|'); return `<tr><td>${kk}</td><td>${w}</td><td>${v}</td></tr>`; }).join('')}</table></div>`;
  el.appendChild(rule);
  const tg = el.appendChild(Object.assign(document.createElement('div'), { className: 'toggle' }));
  const detail = el.appendChild(document.createElement('div'));
  detail.style.cssText = 'border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:10px';
  const list = el.appendChild(Object.assign(document.createElement('div'), { className: 'tablewrap' }));
  list.style.maxHeight = '420px';
  list.style.overflowY = 'auto';
  const st = { notes: 'all', both: false, g: 0, pick: [null, null] };
  const mono = 'font-family:var(--font-mono)';
  const names = (shape) => shape.split(' ').map(Number).map(noteName).join(' ');
  const made = (c) => sizesOf(c).map((n) => `${n}: ${c.producers.filter((p) => p.n === n).length}`).join(' · ');
  const drawList = () => {
    const ks = [...new Set(Z.groups.map(k))];
    tg.innerHTML = [['all', 'all pairs'], ...ks.map((x) => [String(x), `${x} notes`])].map(([v, l]) => `<button type="button" data-k="${v}" class="${st.notes === v ? 'on' : ''}">${l}</button>`).join('') +
      `<button type="button" data-both class="${st.both ? 'on' : ''}">made by 3- and 4-interval sets</button>`;
    tg.querySelectorAll('[data-k]').forEach((b) => b.addEventListener('click', () => { st.notes = b.dataset.k; drawList(); }));
    tg.querySelector('[data-both]').addEventListener('click', () => { st.both = !st.both; drawList(); });
    const shown = Z.groups.map((g, i) => [g, i]).filter(([g]) => (st.notes === 'all' || k(g) === +st.notes) && (!st.both || g.chords.some((c) => sizesOf(c).length > 1)));
    list.innerHTML = `<table><thead><tr><th>#</th><th>notes</th><th>chord A</th><th>chord B</th><th>sets making A (by size)</th><th>sets making B</th></tr></thead><tbody>${shown.map(([g, i]) =>
      `<tr data-g="${i}" style="cursor:pointer;${i === st.g ? 'background:var(--hi)' : ''}"><td>${i + 1}</td><td>${k(g)}</td><td style="${mono}">${g.chords[0].shape}</td><td style="${mono}">${g.chords[1].shape}</td><td>${made(g.chords[0])}</td><td>${made(g.chords[1])}</td></tr>`).join('')}</tbody></table>`;
    list.querySelectorAll('tr[data-g]').forEach((r) => r.addEventListener('click', () => { st.g = +r.dataset.g; st.pick = [null, null]; drawList(); drawDetail(); }));
  };
  const drawDetail = () => {
    const g = Z.groups[st.g];
    // which producer each side shows: the chosen one, else the first 3-interval one, else the first
    const shownP = g.chords.map((c, ci) => c.producers[st.pick[ci] ?? Math.max(0, c.producers.findIndex((p) => p.n === 3))]);
    const placed = shownP.map((p) => { const r = p.rules.equal ? 'equal' : 'shared'; const [ord, W, notes, mirrored, rough] = p.rules[r]; return { p, rule: r, ord, W, notes, mirrored, rough, pl: { ...MIX.place(r, ord.split(' ').map(Number), W), W } }; });
    const HI = Math.max(24, ...placed.map((x) => x.W)), step = Math.max(5, Math.min(10, 360 / HI)), top = 10;
    const gg = { HI, H: top + HI * step + 10, y: (m) => top + (HI - m) * step };
    const colors = ['var(--s-a)', 'var(--s-b)', 'var(--s-c)', 'var(--s-d)', 'var(--s-e)'];
    let ax = `<svg width="38" height="${gg.H}" aria-hidden="true">`;
    for (let m = 0; m <= HI; m += 12) ax += `<text x="34" y="${gg.y(m) + 4}" text-anchor="end" font-size="11" font-family="var(--font-mono)" fill="var(--muted)">${noteName(m)}</text>`;
    ax += '</svg>';
    const side = (c, ci) => {
      const x = placed[ci], sizes = [...new Set(x.p.set.split(' ').map(Number))];
      const groupsBy = sizesOf(c).map((n) => {
        const ps = c.producers.map((p, pi) => [p, pi]).filter(([p]) => p.n === n);
        const kk = c.shape.split(' ').length;
        return `<div style="display:flex;flex-direction:column;gap:4px"><div class="muted" style="font-size:0.8rem">${n} intervals · ${2 * n - kk} merged note${2 * n - kk === 1 ? '' : 's'} · ${ps.length} set${ps.length === 1 ? '' : 's'}</div>` +
          `<div class="toggle">${ps.map(([p, pi]) => `<button type="button" data-side="${ci}" data-p="${pi}" class="${p === x.p ? 'on' : ''}" style="${mono}">${p.set}</button>`).join('')}</div></div>`;
      }).join('');
      return `<div style="display:flex;flex-direction:column;gap:6px;min-width:0;flex:1 1 300px">` +
        `<div class="muted" style="font-size:0.78rem;font-weight:600;letter-spacing:0.05em;text-transform:uppercase">chord ${'AB'[ci]}</div>` +
        `<div style="${mono}">${c.shape} <span class="muted">(${names(c.shape)})</span></div>` +
        `<div style="display:flex;gap:12px;align-items:flex-start"><div style="display:flex">${ax}${MIX.colSvg(x.pl, gg, (sz) => colors[sizes.indexOf(sz)] || 'var(--muted)')}</div>` +
        `<div style="display:flex;flex-direction:column;gap:3px;font-size:0.88rem"><div>set <b style="${mono}">${x.p.set}</b>, ordering <span style="${mono}">${x.ord}</span>, ${RULES.find((r) => r[0] === x.rule)[1]}, window ${x.W}</div>` +
        `<div style="${mono}">${x.notes.split(' ').map(Number).map(noteName).join(' ')}</div>` +
        `<div class="muted">${x.mirrored ? 'placed as the mirror image (upside down) of chord ' + 'AB'[ci] + '; ' : ''}merged notes <b style="color:var(--fg)">${x.pl.merges}</b> · roughness <b style="color:var(--fg)">${x.rough.toFixed(3)}</b></div>` +
        `<div><button type="button" data-open="${ci}">Open this set's tile</button></div></div></div>` + groupsBy + '</div>';
    };
    detail.innerHTML = `<div style="display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline"><h3 style="margin:0;font-size:1rem;font-family:var(--font-display)">Pair ${st.g + 1}: ${g.chords[0].shape.split(' ').length}-note chords</h3>` +
      `<span class="muted" style="font-size:0.85rem">shared distances <span style="${mono};color:var(--fg)">${g.content}</span></span></div>` +
      `<p class="muted" style="font-size:0.85rem;margin:0">Both chords are drawn from one set that makes them (a 3-interval set when there is one); click another set to see how it builds the same chord, and open its tile to step into the atlas from there.</p>` +
      `<div style="display:flex;flex-wrap:wrap;gap:24px">${g.chords.map(side).join('')}</div>`;
    detail.querySelectorAll('[data-side]').forEach((b) => b.addEventListener('click', () => { st.pick[+b.dataset.side] = +b.dataset.p; drawDetail(); }));
    detail.querySelectorAll('[data-open]').forEach((b) => b.addEventListener('click', () => { const x = placed[+b.dataset.open]; window.openTile({ n: x.p.n, set: x.p.set, rule: x.rule, order: x.ord, W: x.W }); }));
  };
  drawList();
  drawDetail();
}

// the window filter bar
{
  const bar = document.getElementById('filterbar');
  const PRESETS = [[1, WMAX, 'all'], [1, 12, '1–12'], [12, 24, '12–24'], [24, 36, '24–36'], [36, 48, '36–48'], [48, WMAX, '48–' + WMAX]];
  const render = () => {
    bar.innerHTML = `<b>Windows</b><label>from <input type="number" id="wr-lo" min="1" max="${WMAX}" value="${WR.lo}"></label><label>to <input type="number" id="wr-hi" min="1" max="${WMAX}" value="${WR.hi}"></label>` +
      PRESETS.map(([lo, hi, l]) => `<button type="button" data-lo="${lo}" data-hi="${hi}" class="${WR.lo === lo && WR.hi === hi ? 'on' : ''}">${l}</button>`).join('') +
      '<span class="muted">applies to every chart, table and the heatmap; the lookup grids keep their own window</span>';
    bar.querySelectorAll('button').forEach((b) => b.addEventListener('click', () => set(+b.dataset.lo, +b.dataset.hi)));
    const lo = bar.querySelector('#wr-lo'), hi = bar.querySelector('#wr-hi');
    lo.addEventListener('change', () => set(+lo.value, WR.hi));
    hi.addEventListener('change', () => set(WR.lo, +hi.value));
  };
  const set = (lo, hi) => {
    lo = Math.max(1, Math.min(WMAX, Math.round(lo) || 1)); hi = Math.max(1, Math.min(WMAX, Math.round(hi) || WMAX));
    if (lo > hi) [lo, hi] = [hi, lo];
    WR.lo = lo; WR.hi = hi;
    render();
    for (const f of REDRAW) f();
  };
  render();
}
</script>
